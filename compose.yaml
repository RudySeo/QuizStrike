services:
  mysql:
    image: mysql:8.4
    container_name: quiz-striker-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quiz_striker}
      MYSQL_USER: ${MYSQL_USER:-quiz_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-quiz_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql_data:
